name: Build reefy-qr-access image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # Temporarily on GitHub-hosted: self-hosted runner (big-bird-not-large)
    # has been intermittently corrupting TLS streams to ghcr.io
    # ("tls: bad record MAC") during buildcache pulls, failing every
    # build of v2026.05.20-01. Swap back to [self-hosted] once big-bird's
    # outbound TLS is stable. Same network class also caused firmware
    # download failures earlier today.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read image tag from reefy/app.json
        id: meta
        run: |
          IMAGE=$(jq -r .image reefy/app.json)
          # IMAGE looks like: ghcr.io/reefyai/reefy-qr-access:v2026.05.02-00
          TAG="${IMAGE##*:}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/reefyai/reefy-qr-access:latest
          provenance: false
          sbom: false
          # Registry-based cache: layers stored as :buildcache tag in the
          # same GHCR package. Avoids the 10 GB org cache cap (torch +
          # tensorrt alone is ~6.7 GB). First build after this change
          # populates :buildcache; subsequent builds reuse all layers
          # whose RUN line + context didn't change.
          cache-from: type=registry,ref=ghcr.io/reefyai/reefy-qr-access:buildcache
          cache-to: type=registry,ref=ghcr.io/reefyai/reefy-qr-access:buildcache,mode=max

      - run: echo "Pushed ${{ steps.meta.outputs.image }}"

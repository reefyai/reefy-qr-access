name: Build reefy-qr-access image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.head_ref && format('refs/heads/{0}', github.head_ref)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  build-push:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Read image tag from reefy/app.json
        id: meta
        run: |
          IMAGE=$(jq -r .image reefy/app.json)
          # IMAGE looks like: ghcr.io/reefyai/reefy-qr-access:v2026.05.02-00
          TAG="${IMAGE##*:}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/reefyai/reefy-qr-access:latest
          provenance: false
          sbom: false
          # Registry-based cache: layers stored as :buildcache tag in the
          # same GHCR package. Avoids the 10 GB org cache cap (torch +
          # tensorrt alone is ~6.7 GB). First build after this change
          # populates :buildcache; subsequent builds reuse all layers
          # whose RUN line + context didn't change.
          cache-from: type=registry,ref=ghcr.io/reefyai/reefy-qr-access:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/reefyai/reefy-qr-access:buildcache,mode=max' || '' }}

      - if: github.event_name != 'pull_request'
        run: echo "Pushed ${{ steps.meta.outputs.image }}"
